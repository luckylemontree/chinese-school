<!-- JavaScript code to ensure the Bootstrap mobile navbar collapses when navigating to in-page links -->

<script>
    document
        .querySelectorAll(".navbar-collapse .nav-link")
        .forEach((link) => {
            link.addEventListener("click", function (e) {
                let section = document.querySelector(e.target.getAttribute("href"));
                if (section) {
                    e.preventDefault(); // Prevent default anchor click behavior
                    let navbarHeight = document.querySelector(".navbar-toggler").offsetHeight;
                    window.scroll({
                        top: section.offsetTop - navbarHeight, // Adjust for navbar height
                        behavior: "smooth",
                    });
                    document
                        .querySelector(".navbar-collapse")
                        .classList.remove("show"); // Collapse navbar
                }
            });
        });
</script>



<!--google translate -->
<script>

    // Track current language
    let isChinese = false;

    // Find the translate button
    document.getElementById("translateBtn").addEventListener("click", function () {

        // Find Google Translate dropdown
        const select = document.querySelector(".goog-te-combo");

        // Stop if dropdown not loaded
        if (!select) return;

        // Change language
        if (!isChinese) {

            // Translate to Chinese
            select.value = "zh-CN";

            // Change button text
            this.textContent = "English";

        } else {

            // Translate back to English
            select.value = "en";

            // Change button text
            this.textContent = "中文";
        }

        // Trigger translation
        select.dispatchEvent(new Event("change"));

        // Switch language state
        isChinese = !isChinese;
    });
</script>
